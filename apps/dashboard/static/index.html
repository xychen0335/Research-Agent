<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Agent 轨迹看板</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="mast">
    <div>
      <p class="kicker">Research Agent</p>
      <h1>轨迹看板</h1>
    </div>
    <p class="note">数字来自 <code>outputs/</code> 里的真实事件。未运行显示未运行，不填零分。</p>
  </header>
  <section class="controls">
    <label>左
      <select id="left-run"></select>
    </label>
    <label>右
      <select id="right-run"></select>
    </label>
    <button id="reload" type="button">刷新</button>
  </section>
  <section id="metrics" class="metrics"></section>
  <section class="live">
    <h2>在线提问</h2>
    <form id="live-form">
      <input id="live-q" type="text" placeholder="输入研究问题" required>
      <select id="live-policy" aria-label="在线策略">
        <option value="scripted">scripted</option>
        <option value="ollama">qwen3.5:4b</option>
      </select>
      <button type="submit">运行</button>
    </form>
    <p class="note">scripted 写入合成语料对照。qwen3.5:4b 走本机 Ollama 与 PaperSearchQA 子集，耗时约半分钟。</p>
  </section>
  <section id="showcase-section">
    <h2>计算机科研案例</h2>
    <p class="note">固定合成题 <code>cs-005</code>：BoostNet 相对 SyncRet 的 4.2 点提升是否依赖额外数据或划分。脚本 oracle 对照无检索；不是训练后的 Qwen3.5-4B。下方规划对照由固定提取器生成，人工盲评分栏为空。</p>
    <div id="showcase"></div>
  </section>
  <section>
    <h2>同一问题对照</h2>
    <div id="compare"></div>
  </section>
  <section>
    <h2>事件</h2>
    <pre id="detail">选择一行查看搜索词、阅读段落和提交。</pre>
  </section>
  <script src="/static/app.js"></script>
</body>
</html>
