# Overlay for `python -m verl.trainer.main_ppo`. This is not a homemade trainer.
# Hydra loads verl's own ppo_trainer.yaml; these keys override that file.
status: not_run
framework_entry: verl.trainer.main_ppo
algorithm:
  adv_estimator: grpo
data:
  train_files: data/processed/papersearchqa/public/verl_train.parquet
  val_files: data/processed/papersearchqa/public/verl_test.parquet
  return_raw_chat: true
  train_batch_size: 4
actor_rollout_ref:
  model:
    path: models/Qwen3.5-4B
    lora_rank: 16
    lora_alpha: 32
  actor:
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: true
    kl_loss_coef: 0.02
  rollout:
    name: vllm
    mode: async
    n: 4
    agent:
      default_agent_loop: research_agent
      agent_loop_config_path: configs/training/verl_agent_loop.yaml
      data: data/processed/papersearchqa
reward:
  custom_reward_function:
    path: research_agent/training/verl/reward_adapter.py
    name: compute_score
trainer:
  n_gpus_per_node: 1
  nnodes: 1
  total_epochs: 1
  total_training_steps: 1
  logger: console
  project_name: research-agent
  experiment_name: gpu-mini
research_agent:
  data: data/processed/papersearchqa
note: Launch with scripts/train/verl_grpo.sh on a CUDA node that has verl installed. CPU machines must not run this entry.
